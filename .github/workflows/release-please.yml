# Automated publishing, on every landing on main.
#
# release-please reads the commit messages (Conventional Commits), derives the
# next version from them and maintains a release pull request holding the
# CHANGELOG and the version number. The tag and the GitHub release are only
# created when that pull request is merged: publishing stays a deliberate act,
# while being entirely computed.
#
# The same build then does two things with the exact same `dist/`, so the
# downloadable archive and the hosted copy can never drift apart: it is
# attached to the GitHub release, and published to GitHub Pages.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Two landings on main in quick succession must not race for the release pull
# request: they queue instead, and none is cancelled halfway through a tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Compute the version and the changelog
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The steps below only run right after the release pull request has been
      # merged, that is once the tag has been created.
      - name: Check out the repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v5
        with:
          # Full history and tags: the user-facing changelog step below
          # walks the commits since the previous tag.
          fetch-depth: 0
          # The upload below authenticates through GH_TOKEN, not through git.
          persist-credentials: false

      - name: Set up Node
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      # A short, French, user-facing summary of the release — never the
      # technical CHANGELOG.md above — read by the in-app "what's new" popup
      # and prepended to the GitHub release notes.
      - name: Build the user-facing changelog
        if: ${{ steps.release.outputs.release_created }}
        run: node scripts/build-user-changelog.mjs
        env:
          NEW_TAG: ${{ steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # The service worker and the offline install are part of what a release
      # publishes: unlike the hosted preview, this build keeps the PWA.
      - name: Build the application
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Attach the build to the release
        if: ${{ steps.release.outputs.release_created }}
        run: |
          tag='${{ steps.release.outputs.tag_name }}'
          archive="orthobox-${tag}.zip"
          (cd dist && zip -qr "../${archive}" .)
          gh release upload "${tag}" "${archive}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The checkout keeps no credentials, so name the repository rather
          # than letting gh infer it from the git remote.
          GH_REPO: ${{ github.repository }}

      - name: Package the build for GitHub Pages
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # A separate job so the deployment gets its own `github-pages` environment
  # (the URL shown on the commit and in the repository's Environments tab),
  # and so the elevated `id-token` permission stays scoped to the one step
  # that needs it rather than sitting on the whole release job.
  deploy:
    name: Publish to GitHub Pages
    needs: release
    if: ${{ needs.release.outputs.released }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
