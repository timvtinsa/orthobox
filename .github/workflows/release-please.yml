# Automated publishing, on every landing on main.
#
# release-please reads the commit messages (Conventional Commits), derives the
# next version from them and maintains a release pull request holding the
# CHANGELOG and the version number. The tag and the GitHub release are only
# created when that pull request is merged: publishing stays a deliberate act,
# while being entirely computed.
#
# The same build is then reused for everything downstream, so the downloadable
# archive and every hosted copy can never drift apart: it is attached to the
# GitHub release and published to GitHub Pages. Along the way, a single call
# to Claude Code (the cheap `claude-haiku-4-5`, authenticated with a Claude
# subscription rather than paid API credits) turns the release's commits
# into a short, French, user-facing changelog (see "Write the user-facing
# changelog" below) — the in-app "what's new" popup reads it, and it is
# never the same text as the technical CHANGELOG.md above. That step never
# blocks the release: without a working CLAUDE_CODE_OAUTH_TOKEN, or on any
# other failure, the release still publishes, just without a user-facing
# changelog that time.
#
# Cloudflare is deployed separately, by Cloudflare's own git integration
# (production branch: main), not from here: it already gives every other
# branch and pull request its own preview deployment for free, which a
# release-only step in this workflow cannot reproduce. `wrangler.jsonc`
# is what makes that pipeline work (it stops Wrangler from trying to
# auto-configure a Cloudflare Vite plugin integration, which needs Vite 6+).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Needed by the Claude Code Action step below, regardless of which of its
  # own authentication methods is in play.
  id-token: write

# Two landings on main in quick succession must not race for the release pull
# request: they queue instead, and none is cancelled halfway through a tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Compute the version and the changelog
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The steps below only run right after the release pull request has been
      # merged, that is once the tag has been created.
      - name: Check out the repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v5
        with:
          # Full history and tags: the user-facing changelog step below walks
          # the commits since the previous tag.
          fetch-depth: 0
          # The upload below authenticates through GH_TOKEN, not through git.
          persist-credentials: false

      - name: Set up Node
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      # A short, French, user-facing summary of the release — never the
      # technical CHANGELOG.md above — read by the in-app "what's new"
      # popup. Claude reads the release's commits directly (`Bash`, scoped
      # to read-only `git tag`/`git log`) and writes `public/whats-new.json`
      # itself (`Write`); runs before the build below, since that file has
      # to exist for Vite to copy it into `dist/`. Authenticated with a
      # Claude subscription (`claude_code_oauth_token`, generated by running
      # `claude setup-token`) rather than a paid API key, so this costs
      # nothing beyond the subscription itself. `continue-on-error`: a
      # release must never be blocked by this step, whether the token is
      # missing, expired, or anything else goes wrong.
      - name: Write the user-facing changelog
        if: ${{ steps.release.outputs.release_created }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-haiku-4-5
            --allowedTools "Bash(git tag *),Bash(git log *),Write"
          prompt: |
            You are writing the "what's new" summary shown once to Orthobox
            users right after they update to a new version. Orthobox is a
            French-language web app used during speech-therapy sessions: a
            toolbox of short games for a speech therapist and their patient,
            often a child. Your audience is a parent, a speech therapist, or
            occasionally a curious teenager — never a developer.

            This release is tagged ${{ steps.release.outputs.tag_name }}.
            Run `git tag --list 'v*' --sort=-creatordate` and find the tag
            immediately after ${{ steps.release.outputs.tag_name }} in that
            list: that is the previous release, or there is none if
            ${{ steps.release.outputs.tag_name }} is the last entry. Then
            read every commit in this release with
            `git log <range> --no-merges --format='%s%n%b'`, where <range>
            is `<previous tag>..${{ steps.release.outputs.tag_name }}` (or
            just `${{ steps.release.outputs.tag_name }}` if there is no
            previous tag).

            From those commits, write a short list of highlights, each a
            single short French sentence, for a change a user would
            actually notice: a new game, a visible interface or usability
            improvement, or a bug fix that affected what they could do or
            see. Leave out anything purely internal: dependency bumps, CI or
            release-workflow changes, refactors, test additions,
            documentation, build tooling, or performance work invisible to
            the user. If the release has nothing a user would notice, use
            an empty list rather than inventing a line. Merge commits that
            describe facets of the same visible change into a single line
            rather than listing each separately.

            Write in plain, warm French: one clause per idea, no jargon, no
            markdown, no emoji, each line capitalised and ending with a
            period like an ordinary sentence.

            Write the result to public/whats-new.json as valid JSON and
            nothing else, with exactly this shape:
            {"version": "<the tag above without its leading v>", "highlights": ["...", "..."]}

      # The service worker and the offline install are part of what a release
      # publishes: unlike the hosted preview, this build keeps the PWA.
      - name: Build the application
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Update the release notes with the user-facing changelog
        if: ${{ steps.release.outputs.release_created }}
        run: node scripts/update-release-notes.mjs
        env:
          NEW_TAG: ${{ steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Attach the build to the release
        if: ${{ steps.release.outputs.release_created }}
        run: |
          archive="orthobox-${TAG_NAME}.zip"
          (cd dist && zip -qr "../${archive}" .)
          gh release upload "${TAG_NAME}" "${archive}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The checkout keeps no credentials, so name the repository rather
          # than letting gh infer it from the git remote.
          GH_REPO: ${{ github.repository }}
          # Passed through the environment rather than interpolated straight
          # into the script: the shell never sees this value before the
          # variable expansion, which is the safe pattern regardless of how
          # trusted `tag_name` happens to be today.
          TAG_NAME: ${{ steps.release.outputs.tag_name }}

      - name: Package the build for GitHub Pages
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # A separate job so the deployment gets its own `github-pages` environment
  # (the URL shown on the commit and in the repository's Environments tab),
  # and so the `pages` permission stays scoped to the one step that needs it
  # rather than sitting on the whole release job (`id-token` is already
  # needed there too, by the Claude Code Action step above).
  deploy:
    name: Publish to GitHub Pages
    needs: release
    if: ${{ needs.release.outputs.released }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
