# Automated publishing, on every landing on integ.
#
# release-please reads the commit messages (Conventional Commits), derives the
# next version from them and maintains a release pull request holding the
# CHANGELOG and the version number. The tag and the GitHub release are only
# created when that pull request is merged: publishing stays a deliberate act,
# while being entirely computed. It runs against `integ`, not `main`: `integ`
# is where every feature branch actually lands, so that is where a release's
# commit history is complete.
#
# The same build is then reused for everything downstream, so the downloadable
# archive and every hosted copy can never drift apart: it is attached to the
# GitHub release and published to GitHub Pages.
#
# `main` never takes ordinary development commits directly: the only thing
# that ever lands there is a release, promoted automatically right after
# release-please tags it on `integ` (see "Promote the release to main"
# below). The tag itself is then force-moved to point at that new commit on
# `main` (see "Move the tag onto main"), so the tag always resolves to a
# commit that is actually on `main`, not merely one of its ancestors.
# Cloudflare is deployed separately, by Cloudflare's own git integration
# (production branch: main), not from here: it already gives every other
# branch and pull request its own preview deployment for free, which a
# release-only step in this workflow cannot reproduce. Since Cloudflare
# deploys automatically the moment `main` changes, that promotion is what
# actually ships a release to production. `wrangler.jsonc` is what makes
# that separate pipeline work (it stops Wrangler from trying to
# auto-configure a Cloudflare Vite plugin integration, which needs Vite 6+).
name: Release

on:
  push:
    branches: [integ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Two landings on integ in quick succession must not race for the release
# pull request: they queue instead, and none is cancelled halfway through a
# tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Compute the version and the changelog
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: integ

      # `main` requires a pull request for any change, same as `integ` (branch
      # rulesets, no bypass for anyone) — a direct push here would simply be
      # rejected, so the promotion itself has to be a real PR. It needs zero
      # approvals and `main` enforces no status check, so it merges right
      # away: from a viewer's standpoint this is still one automatic step,
      # not a wait for review.
      - name: Promote the release to main
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Passed through the environment rather than interpolated straight
          # into the script, matching the pattern below.
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          existing=$(gh pr list --base main --head integ --state open --json number -q '.[0].number // empty')
          if [ -n "$existing" ]; then
            pr="$existing"
          else
            pr=$(gh pr create --base main --head integ \
              --title "chore(main): release ${TAG_NAME}" \
              --body "Promotes the release just tagged on \`integ\` (${TAG_NAME}) to \`main\`. Cloudflare's Workers Builds integration deploys production from \`main\`, so merging this is what actually ships the release." \
              | grep -oE '[0-9]+$')
          fi
          gh pr merge "$pr" --merge

      # release-please created the tag on `integ`, but the release has to be
      # identifiable as being on `main`: branch rulesets only scope to
      # `refs/heads/*` (checked directly against both rulesets' API
      # configuration), never `refs/tags/*`, so a tag can be force-moved via
      # the API even though a direct push to `main` or `integ` would be
      # rejected. `main`'s tip is exactly the commit just promoted above, so
      # this makes the tag point at a commit that is actually on `main`.
      - name: Move the tag onto main
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          sha=$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)
          gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${TAG_NAME}" \
            -f sha="$sha" -F force=true

      # The steps below only run right after the release pull request has been
      # merged, that is once the tag has been created.
      - name: Check out the repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v5
        with:
          # The upload below authenticates through GH_TOKEN, not through git.
          persist-credentials: false

      - name: Set up Node
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      # The service worker and the offline install are part of what a release
      # publishes: unlike the hosted preview, this build keeps the PWA.
      - name: Build the application
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Attach the build to the release
        if: ${{ steps.release.outputs.release_created }}
        run: |
          archive="orthobox-${TAG_NAME}.zip"
          (cd dist && zip -qr "../${archive}" .)
          gh release upload "${TAG_NAME}" "${archive}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The checkout keeps no credentials, so name the repository rather
          # than letting gh infer it from the git remote.
          GH_REPO: ${{ github.repository }}
          # Passed through the environment rather than interpolated straight
          # into the script: the shell never sees this value before the
          # variable expansion, which is the safe pattern regardless of how
          # trusted `tag_name` happens to be today.
          TAG_NAME: ${{ steps.release.outputs.tag_name }}

      - name: Package the build for GitHub Pages
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # A separate job so the deployment gets its own `github-pages` environment
  # (the URL shown on the commit and in the repository's Environments tab),
  # and so the elevated `id-token` permission stays scoped to the one step
  # that needs it rather than sitting on the whole release job.
  deploy:
    name: Publish to GitHub Pages
    needs: release
    if: ${{ needs.release.outputs.released }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
