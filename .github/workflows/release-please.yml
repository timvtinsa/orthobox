# Automated publishing, on every landing on main.
#
# release-please reads the commit messages (Conventional Commits), derives the
# next version from them and maintains a release pull request holding the
# CHANGELOG and the version number. The tag and the GitHub release are only
# created when that pull request is merged: publishing stays a deliberate act,
# while being entirely computed.
#
# The build is attached to the GitHub release as a downloadable archive.
# Along the way, a single call
# to Claude Code (the cheap `claude-haiku-4-5`, authenticated with a Claude
# subscription rather than paid API credits) turns the release's commits
# into a short, French, user-facing changelog (see "Write the user-facing
# changelog" below) — the in-app "what's new" popup reads it, and it is
# never the same text as the technical CHANGELOG.md above. That step never
# blocks the release: without a working CLAUDE_CODE_OAUTH_TOKEN, or on any
# other failure, the release still publishes, just without a user-facing
# changelog that time.
#
# Cloudflare is deployed separately, by Cloudflare's own git integration
# (production branch: main), not from here: it already gives every other
# branch and pull request its own preview deployment for free, which a
# release-only step in this workflow cannot reproduce. `wrangler.jsonc`
# is what makes that pipeline work (it stops Wrangler from trying to
# auto-configure a Cloudflare Vite plugin integration, which needs Vite 6+).
name: Release

on:
  push:
    branches: [main]
  # Re-runs the publishing steps for an existing release whose changelog step
  # failed: pass its tag (the latest one — the build is made from the
  # checked-out branch). Without a tag it only refreshes the release pull request.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish the user-facing changelog for (e.g. v0.6.0)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

# Two landings on main in quick succession must not race for the release pull
# request: they queue instead, and none is cancelled halfway through a tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Compute the version and the changelog
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release to publish: the one just created, or the one named when
      # the workflow is started by hand. Every step below runs only when there
      # is one, that is right after the release pull request has been merged
      # (the tag has just been created) or on a manual re-run.
      - name: Pick the release to publish
        id: target
        env:
          CREATED: ${{ steps.release.outputs.release_created }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "$CREATED" = "true" ]; then
            echo "tag=$CREATED_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: ${{ steps.target.outputs.tag != '' }}
        uses: actions/checkout@v7
        with:
          # Full history and tags: the user-facing changelog step below walks
          # the commits since the previous tag.
          fetch-depth: 0
          # The upload below authenticates through GH_TOKEN, not through git.
          persist-credentials: false

      - name: Set up Node
        if: ${{ steps.target.outputs.tag != '' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: ${{ steps.target.outputs.tag != '' }}
        run: npm ci

      # Computed here rather than left to Claude itself: on a small release
      # this worked as an agentic Bash task, but on a much larger one (a
      # long-overdue main sync, dozens of commits) Claude's own attempt at
      # it silently produced no file at all — no error, just nothing, which
      # `continue-on-error` below then made invisible. A plain, deterministic
      # step can't have that failure mode, and it also means the step below
      # needs only `Write`, not `Bash`, which is one less way to run out of
      # turns before actually writing anything.
      - name: Prepare the release commit log
        if: ${{ steps.target.outputs.tag != '' }}
        id: commits
        env:
          NEW_TAG: ${{ steps.target.outputs.tag }}
        run: |
          mapfile -t tags < <(git tag --list 'v*' --sort=-creatordate)
          previous=""
          for i in "${!tags[@]}"; do
            if [ "${tags[$i]}" = "$NEW_TAG" ]; then
              next=$((i + 1))
              [ "$next" -lt "${#tags[@]}" ] && previous="${tags[$next]}"
              break
            fi
          done
          range="${previous:+$previous..}$NEW_TAG"
          {
            echo "range=$range"
            echo "log<<COMMIT_LOG_EOF"
            git log "$range" --no-merges --format='%s%n%b%n---'
            echo "COMMIT_LOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # A short, French, user-facing summary of the release — never the
      # technical CHANGELOG.md above — read by the in-app "what's new"
      # popup. The Claude Code CLI is called directly (see the script): the
      # `claude-code-action` this used to use rejects the `push` event this
      # workflow runs on, which went unseen for three releases. Runs before
      # the build below, since `public/whats-new.json` has to exist for Vite
      # to copy it into `dist/`. Authenticated with a Claude subscription
      # (`CLAUDE_CODE_OAUTH_TOKEN`, generated by running `claude setup-token`)
      # rather than a paid API key. `continue-on-error`: a release must never
      # be blocked by this step — but the script reports its failure as an
      # error annotation, so it can no longer pass unnoticed.
      - name: Write the user-facing changelog
        if: ${{ steps.target.outputs.tag != '' }}
        continue-on-error: true
        run: node scripts/write-whats-new.mjs
        env:
          NEW_TAG: ${{ steps.target.outputs.tag }}
          COMMIT_LOG: ${{ steps.commits.outputs.log }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # The service worker and the offline install are part of what a release
      # publishes: unlike the hosted preview, this build keeps the PWA.
      - name: Build the application
        if: ${{ steps.target.outputs.tag != '' }}
        run: npm run build

      - name: Update the release notes with the user-facing changelog
        if: ${{ steps.target.outputs.tag != '' }}
        run: node scripts/update-release-notes.mjs
        env:
          NEW_TAG: ${{ steps.target.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Attach the build to the release
        if: ${{ steps.target.outputs.tag != '' }}
        run: |
          archive="orthobox-${TAG_NAME}.zip"
          (cd dist && zip -qr "../${archive}" .)
          gh release upload "${TAG_NAME}" "${archive}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The checkout keeps no credentials, so name the repository rather
          # than letting gh infer it from the git remote.
          GH_REPO: ${{ github.repository }}
          # Passed through the environment rather than interpolated straight
          # into the script: the shell never sees this value before the
          # variable expansion, which is the safe pattern regardless of how
          # trusted `tag_name` happens to be today.
          TAG_NAME: ${{ steps.target.outputs.tag }}
