# Continuous integration: anything landing on an integration branch or coming
# through a pull request must pass lint, tests and build.
name: CI

on:
  push:
    branches: [main, integ]
  pull_request:
    branches: [main, integ]
  workflow_dispatch:

# One run per branch: a new push cancels the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    # A hung step fails the run instead of sitting there for six hours.
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Nothing here pushes: the checkout keeps no credentials around.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The version lives in .nvmrc, so the workstation and the workflow
          # cannot drift apart.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs the same tests as `npm test`, plus the coverage thresholds set
      # in vite.config.js: a pull request that drops coverage below that
      # floor fails here, the same way it would locally.
      - name: Tests, with a coverage floor
        run: npm run test:coverage

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 7

      - name: Build
        run: npm run build

      # `npm run build` regenerates the PWA icons, which are versioned. A dirty
      # tree here means the generator and the committed files disagree: either
      # an icon was edited by hand, or the generator changed without its output
      # being replayed.
      - name: Check the generated files are up to date
        run: |
          if ! git diff --quiet; then
            echo "Des fichiers générés diffèrent de ce qui est versionné :"
            git --no-pager diff --stat
            echo "Lancez « npm run build », puis committez le résultat."
            exit 1
          fi

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  # Layout and accessibility, on phone, tablet and desktop sizes. A separate
  # job: it needs a browser, and takes longer than the unit tests.
  e2e:
    name: Responsive and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # To list the files a pull request changes (see "Does the change reach
      # the screens?" below).
      pull-requests: read
    steps:
      # A pull request that only touches documentation, a Markdown file or the
      # workflows around CI (not this one) cannot change what the browser
      # tests look at: they are skipped, and the job still reports a success.
      # The job itself always runs, so a required check never stays pending.
      - name: Does the change reach the screens?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
            if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/|.*\.md$|\.github/(dependabot\.yml|workflows/(release-please|claude-code-review)\.yml)$)'; then
              run=false
              echo "Only documentation or unrelated workflows changed: the browser tests are skipped."
            fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Install the browser
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Check every screen on every device size
        if: steps.scope.outputs.run == 'true'
        run: npm run test:e2e

      # Only what is worth reading: the traces of the retried tests, not a
      # copy of every file of a long run.
      - name: Keep the report
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results
          retention-days: 7
