# Continuous integration: anything landing on an integration branch or coming
# through a pull request must pass lint, tests and build.
name: CI

on:
  push:
    branches: [main, integ]
  pull_request:
    branches: [main, integ]
  workflow_dispatch:

# One run per branch: a new push cancels the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    # A hung step fails the run instead of sitting there for six hours.
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # Nothing here pushes: the checkout keeps no credentials around.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # The version lives in .nvmrc, so the workstation and the workflow
          # cannot drift apart.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # `npm run build` regenerates the PWA icons, which are versioned. A dirty
      # tree here means the generator and the committed files disagree: either
      # an icon was edited by hand, or the generator changed without its output
      # being replayed.
      - name: Check the generated files are up to date
        run: |
          if ! git diff --quiet; then
            echo "Des fichiers générés diffèrent de ce qui est versionné :"
            git --no-pager diff --stat
            echo "Lancez « npm run build », puis committez le résultat."
            exit 1
          fi

      - name: Keep the build
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7
