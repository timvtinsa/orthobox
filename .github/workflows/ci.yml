# Contrôle continu : tout ce qui arrive sur une branche d'intégration ou par
# une pull request doit passer le lint, les tests et le build.
name: CI

on:
  push:
    branches: [main, integ]
  pull_request:
    branches: [main, integ]
  workflow_dispatch:

# Une seule exécution par branche : un nouveau push annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Conserver le build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
